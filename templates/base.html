<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitWise - Smart Food Recommendations</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

<style>
body { font-family: "Inter", sans-serif; }

nav {
display:flex;
justify-content:space-between;
align-items:center;
padding:1rem;
position:relative;
}

.nav-menu {
display:flex;
gap:1rem;
list-style:none;
}

.nav-menu a {
color:#4b5563;
text-decoration:none;
font-weight:500;
}

.nav-menu a:hover { color:#16a34a; }

.btn-signup {
background:#16a34a;
color:white;
padding:0.5rem 1rem;
border-radius:6px;
}

.hamburger {
display:none;
flex-direction:column;
cursor:pointer;
gap:5px;
}

.hamburger span {
width:25px;
height:3px;
background:#16a34a;
}

.mobile-menu {
display:none;
flex-direction:column;
background:white;
position:absolute;
top:100%;
left:0;
right:0;
padding:1rem;
box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.mobile-menu.active { display:flex; }

@media(max-width:768px){
.nav-menu { display:none; }
.hamburger { display:flex; }
}
</style>
</head>

<body class="bg-gray-100">

<nav class="bg-white shadow-md">
  <a href="{{ url_for('index') }}" class="font-bold text-2xl text-green-600">
    <i class="fas fa-leaf mr-2"></i>FitWise
  </a>

  <ul class="nav-menu">
    {% if current_user.is_authenticated %}
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('contact') }}">Contact</a></li>
    <li><a href="{{ url_for('logout') }}">Logout</a></li>
    {% else %}
    <li><a href="{{ url_for('contact') }}">Contact</a></li>
    <li><a href="{{ url_for('login') }}">Login</a></li>
    <li><a href="{{ url_for('signup') }}" class="btn-signup">Sign Up</a></li>
    {% endif %}
  </ul>

  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('contact') }}">Contact</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
    <a href="{{ url_for('contact') }}">Contact</a>
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('signup') }}" class="btn-signup">Sign Up</a>
    {% endif %}
  </div>
</nav>

<script>
const hamburger = document.getElementById("hamburger");
const mobileMenu = document.getElementById("mobileMenu");

hamburger.addEventListener("click", ()=>{
hamburger.classList.toggle("active");
mobileMenu.classList.toggle("active");
});
</script>

</body>
</html>
